[package]
name = "argentor-agent"
version.workspace = true
edition.workspace = true
description = "Agentic loop, LLM provider backends, guardrails, and ReAct engine for Argentor"
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Enable the real AWS Bedrock implementation (SigV4-signed HTTP via reqwest).
# Uses sha2/hmac/hex from the workspace — no extra toolchain requirement.
bedrock = []
# Enable the real Cohere v2 chat implementation (reqwest + SSE streaming).
# Requires a valid COHERE API key at runtime.
cohere = []
# Enable the real Replicate async-prediction implementation (reqwest + polling).
# Requires a valid REPLICATE_API_TOKEN at runtime.
replicate = []

[lints]
workspace = true

[dependencies]
argentor-core.workspace = true
argentor-security.workspace = true
argentor-session.workspace = true
argentor-skills.workspace = true
argentor-mcp.workspace = true
serde.workspace = true
chrono.workspace = true
serde_json.workspace = true
reqwest.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
futures-util = "0.3"
tokio-stream = "0.1"
toml.workspace = true
regex.workspace = true
unicode-normalization.workspace = true
base64 = "0.22"
# SigV4 signing for the Bedrock feature (already in the workspace graph)
sha2.workspace = true
hmac.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile = "3"
argentor-builtins = { path = "../argentor-builtins", version = "1.3.0" }
toml.workspace = true
uuid.workspace = true
wiremock.workspace = true
sysinfo = "0.32"
