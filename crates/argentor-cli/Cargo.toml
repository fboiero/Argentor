[package]
name = "argentor-cli"
version.workspace = true
edition.workspace = true
publish = false
description = "Command-line interface and REPL for the Argentor AI agent framework"
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "argentor"
path = "src/main.rs"

[[bin]]
name = "e2e_guardrail_check"
path = "../../tests/e2e_guardrail_check.rs"

[dependencies]
argentor-core.workspace = true
argentor-security.workspace = true
argentor-session.workspace = true
argentor-skills.workspace = true
argentor-agent.workspace = true
argentor-channels.workspace = true
argentor-gateway.workspace = true
argentor-builtins.workspace = true
argentor-mcp.workspace = true
argentor-memory.workspace = true
argentor-compliance.workspace = true
argentor-orchestrator.workspace = true
argentor-a2a.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
toml.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow = "1"
dotenvy = "0.15"
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower.workspace = true
uuid.workspace = true
notify.workspace = true

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"

[[example]]
name = "demo_team"
path = "examples/demo_team.rs"

[[example]]
name = "demo_security_challenge"
path = "examples/demo_security_challenge.rs"

[[example]]
name = "demo_dev_team_video"
path = "examples/demo_dev_team_video.rs"

[[example]]
name = "demo_xcapitsff"
path = "examples/demo_xcapitsff.rs"

[[example]]
name = "demo_saas_factory"
path = "examples/demo_saas_factory.rs"

[[example]]
name = "generate_sdks"
path = "examples/generate_sdks.rs"

[[example]]
name = "demo_full_pipeline"
path = "examples/demo_full_pipeline.rs"

[[example]]
name = "demo_skills_toolkit"
path = "examples/demo_skills_toolkit.rs"
