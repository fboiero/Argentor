<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Argentor — Observability Dashboard</title>
<style>
:root {
  --bg: #0d0d1a; --bg2: #1a1a2e; --card: #16213e; --border: #2a2a4a;
  --accent: #29b6f6; --success: #00c853; --warning: #ffc107;
  --danger: #e94560; --txt: #e0e0e0; --txt2: #9e9e9e; --txt3: #616161;
  --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--txt); overflow-x: hidden; }

nav { position: fixed; top: 0; left: 0; right: 0; height: 52px; background: var(--bg2);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  justify-content: space-between; padding: 0 20px; z-index: 100; }
.brand { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
.brand span { color: var(--accent); }
.nav-right { display: flex; align-items: center; gap: 10px; }
#status-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger);
  display: inline-block; margin-right: 6px; transition: background .3s; }
#status-dot.connected { background: var(--success); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
#status-label { font-family: var(--mono); font-size: 12px; color: var(--txt2); }
#ws-url-input { background: var(--card); border: 1px solid var(--border); color: var(--txt);
  padding: 4px 8px; border-radius: 4px; font-family: var(--mono); font-size: 12px; width: 240px; }
#connect-btn { background: var(--accent); color: #000; border: none; padding: 5px 12px;
  border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
#connect-btn:hover { opacity: .85; }

main { margin-top: 52px; padding: 20px; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 20px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 7px; padding: 16px; }
.stat .val { font-family: var(--mono); font-size: 28px; font-weight: 700; line-height: 1; }
.stat .lbl { font-size: 11px; color: var(--txt2); text-transform: uppercase; letter-spacing: .6px; margin-top: 4px; }
.val.blue { color: var(--accent); } .val.green { color: var(--success); }
.val.yellow { color: var(--warning); } .val.red { color: var(--danger); }

.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.panel-hdr { display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600; }
.panel-hdr .clr { font-size: 11px; color: var(--txt3); cursor: pointer; }
.panel-hdr .clr:hover { color: var(--danger); }
.panel-body { padding: 12px 16px; height: 340px; overflow-y: auto; }

.turn { border-left: 3px solid var(--border); padding: 8px 12px; margin-bottom: 10px;
  border-radius: 0 5px 5px 0; background: rgba(255,255,255,.02); }
.turn.thinking { border-color: var(--warning); }
.turn.tool { border-color: var(--accent); }
.turn.done { border-color: var(--success); }
.turn.error { border-color: var(--danger); }
.turn-hdr { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.turn-ts { font-family: var(--mono); font-size: 10px; color: var(--txt3); }
.turn-sid { font-family: var(--mono); font-size: 10px; color: var(--txt2); }
.badge { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 10px; text-transform: uppercase; }
.badge.thinking { background: rgba(255,193,7,.15); color: var(--warning); }
.badge.tool { background: rgba(41,182,246,.15); color: var(--accent); }
.badge.done { background: rgba(0,200,83,.15); color: var(--success); }
.badge.error { background: rgba(233,69,96,.15); color: var(--danger); }
.turn-content { font-size: 12px; color: var(--txt2); line-height: 1.5; white-space: pre-wrap;
  word-break: break-word; max-height: 80px; overflow: hidden; }

.tc-table { width: 100%; border-collapse: collapse; font-size: 12px; font-family: var(--mono); }
.tc-table th { text-align: left; color: var(--txt3); font-size: 10px; text-transform: uppercase;
  letter-spacing: .5px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.tc-table td { padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,.04);
  color: var(--txt2); vertical-align: top; word-break: break-all; }
.tc-table td:first-child { color: var(--accent); }
.tc-table tr:hover td { background: rgba(255,255,255,.02); }

.cost-row { display: flex; justify-content: space-between; padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,.04); font-size: 13px; }
.cost-row .k { color: var(--txt2); } .cost-row .v { font-family: var(--mono); }
.cost-total { display: flex; justify-content: space-between; padding: 12px 0 4px;
  font-size: 15px; font-weight: 700; }

.session-item { display: flex; align-items: center; gap: 10px; padding: 8px 0;
  border-bottom: 1px solid rgba(255,255,255,.04); font-size: 12px; font-family: var(--mono); }
.session-item .sid { color: var(--accent); flex: 1; overflow: hidden; text-overflow: ellipsis; }
.session-item .sdot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.session-item .turns { color: var(--txt3); font-size: 11px; }
.empty { color: var(--txt3); font-size: 12px; padding: 20px 0; text-align: center; }
.sdot-idle { background: var(--txt3); } .sdot-thinking { background: var(--warning); }
.sdot-tool { background: var(--accent); } .sdot-done { background: var(--success); }
</style>
</head>
<body>

<nav>
  <div class="brand">Argentor <span>Observability</span></div>
  <div class="nav-right">
    <input id="ws-url-input" type="text" value="ws://localhost:8080/ws" />
    <button id="connect-btn">Connect</button>
    <span><span id="status-dot"></span><span id="status-label">disconnected</span></span>
  </div>
</nav>

<main>
  <div class="stats">
    <div class="stat"><div class="val blue" id="s-sessions">0</div><div class="lbl">Active Sessions</div></div>
    <div class="stat"><div class="val green" id="s-turns">0</div><div class="lbl">Total Turns</div></div>
    <div class="stat"><div class="val yellow" id="s-tools">0</div><div class="lbl">Tool Calls</div></div>
    <div class="stat"><div class="val red" id="s-tokens">0</div><div class="lbl">Est. Tokens</div></div>
    <div class="stat"><div class="val green" id="s-cost">$0.00</div><div class="lbl">Est. Cost</div></div>
  </div>

  <div class="panels">
    <div class="panel" style="grid-column:1/-1">
      <div class="panel-hdr">Agent Timeline <span class="clr" id="clr-tl">clear</span></div>
      <div class="panel-body" id="timeline"></div>
    </div>
    <div class="panel">
      <div class="panel-hdr">Tool Calls <span class="clr" id="clr-tc">clear</span></div>
      <div class="panel-body">
        <table class="tc-table">
          <thead><tr><th>Tool</th><th>Session</th><th>Time</th><th>Input</th></tr></thead>
          <tbody id="tool-tbody"></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-hdr">Sessions &amp; Cost</div>
      <div class="panel-body">
        <div id="session-list"></div>
        <div style="margin-top:16px">
          <div class="cost-row"><span class="k">Input tokens</span><span class="v" id="c-in">0</span></div>
          <div class="cost-row"><span class="k">Output tokens</span><span class="v" id="c-out">0</span></div>
          <div class="cost-row"><span class="k">Model</span><span class="v" id="c-model">claude-3-5-sonnet</span></div>
          <div class="cost-total"><span>Estimated cost</span><span id="c-total">$0.00</span></div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
// SPDX-License-Identifier: AGPL-3.0-only
"use strict";

/* ── Pricing table (per 1M tokens) ───────────────────────────────────────── */
var PRICING = {
  "claude-3-5-sonnet": { in: 3.00, out: 15.00 },
  "claude-3-haiku":    { in: 0.25, out: 1.25  },
  "claude-3-opus":     { in: 15.0, out: 75.00 },
};

/* ── State ────────────────────────────────────────────────────────────────── */
var sessions = {};
var totalTurns = 0, totalTools = 0, totalIn = 0, totalOut = 0;
var currentModel = "claude-3-5-sonnet";
var ws = null, reconnectDelay = 2000, reconnectTimer = null, intentionalClose = false;

/* ── DOM helpers ──────────────────────────────────────────────────────────── */
function $(id) { return document.getElementById(id); }
function setText(id, v) { var el = $(id); if (el) el.textContent = v; }
function ts() { return new Date().toLocaleTimeString(); }
function shortId(sid) {
  if (!sid) return "—";
  var s = String(sid);
  return s.length > 12 ? s.slice(0, 8) + "…" : s;
}
function escHtml(s) {
  return String(s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ── Cost ─────────────────────────────────────────────────────────────────── */
function calcCost(inTok, outTok, model) {
  var p = PRICING[model] || PRICING["claude-3-5-sonnet"];
  return (inTok / 1000000) * p.in + (outTok / 1000000) * p.out;
}
function fmtCost(n) { return "$" + n.toFixed(4); }

/* ── Stats update ─────────────────────────────────────────────────────────── */
function updateStats() {
  var active = Object.values(sessions).filter(function(s){ return s.state !== "done"; }).length;
  setText("s-sessions", active);
  setText("s-turns", totalTurns);
  setText("s-tools", totalTools);
  setText("s-tokens", (totalIn + totalOut).toLocaleString());
  var cost = calcCost(totalIn, totalOut, currentModel);
  setText("s-cost", fmtCost(cost));
  setText("c-in", totalIn.toLocaleString());
  setText("c-out", totalOut.toLocaleString());
  setText("c-model", currentModel);
  setText("c-total", fmtCost(cost));
  renderSessions();
}

function renderSessions() {
  var el = $("session-list");
  var entries = Object.entries(sessions);
  if (!entries.length) { el.innerHTML = '<div class="empty">No active sessions</div>'; return; }
  el.innerHTML = entries.map(function(e) {
    var sid = e[0], s = e[1];
    return '<div class="session-item">' +
      '<div class="sdot sdot-' + s.state + '"></div>' +
      '<div class="sid" title="' + escHtml(sid) + '">' + shortId(sid) + '</div>' +
      '<div class="turns">' + s.turns + ' turns</div></div>';
  }).join("");
}

/* ── Timeline ─────────────────────────────────────────────────────────────── */
function addTurn(type, sid, content) {
  var tl = $("timeline");
  var div = document.createElement("div");
  div.className = "turn " + type;
  var preview = content && content.length > 200 ? content.slice(0, 200) + "…" : (content || "");
  div.innerHTML =
    '<div class="turn-hdr">' +
    '<span class="badge ' + type + '">' + type + '</span>' +
    '<span class="turn-sid">' + shortId(sid) + '</span>' +
    '<span class="turn-ts">' + ts() + '</span></div>' +
    '<div class="turn-content">' + escHtml(preview) + '</div>';
  tl.appendChild(div);
  tl.scrollTop = tl.scrollHeight;
}

/* ── Tool call log ─────────────────────────────────────────────────────────── */
function addToolRow(name, sid, inputStr) {
  var tb = $("tool-tbody");
  var tr = document.createElement("tr");
  tr.innerHTML =
    '<td>' + escHtml(name) + '</td>' +
    '<td>' + shortId(sid) + '</td>' +
    '<td>' + ts() + '</td>' +
    '<td style="max-width:200px;overflow:hidden;text-overflow:ellipsis">' + escHtml(inputStr.slice(0, 120)) + '</td>';
  tb.insertBefore(tr, tb.firstChild);
  while (tb.children.length > 100) tb.removeChild(tb.lastChild);
}

/* ── Message handlers ──────────────────────────────────────────────────────── */
function handleResponse(msg) {
  var sid = msg.session_id || "unknown";
  if (!sessions[sid]) sessions[sid] = { state: "idle", turns: 0 };
  var sess = sessions[sid];
  if (msg.msg_type === "response") {
    sess.turns++;
    sess.state = "done";
    totalTurns++;
    var outTok = Math.ceil((msg.content || "").length / 4);
    totalOut += outTok;
    addTurn("done", sid, msg.content);
  } else if (msg.msg_type === "error") {
    sess.state = "done";
    addTurn("error", sid, msg.content);
  }
  updateStats();
}

function handleStream(msg) {
  var sid = msg.session_id || "unknown";
  if (!sessions[sid]) sessions[sid] = { state: "thinking", turns: 0 };
  var sess = sessions[sid];
  var ev = msg.event || {};
  var kind = ev.type || Object.keys(ev)[0] || "unknown";
  if (kind === "TextDelta" || kind === "text_delta") {
    sess.state = "thinking";
    totalOut += Math.ceil(((ev.text || ev.TextDelta || "").length) / 4);
  } else if (kind === "ToolUse" || kind === "tool_use") {
    sess.state = "tool";
    totalTools++;
    var name = ev.name || (ev.ToolUse && ev.ToolUse.name) || "unknown_tool";
    var input = JSON.stringify(ev.input || (ev.ToolUse && ev.ToolUse.input) || {});
    addTurn("tool", sid, name + "(" + input.slice(0, 80) + ")");
    addToolRow(name, sid, input);
  } else if (kind === "Done" || kind === "done") {
    sess.state = "done";
    addTurn("thinking", sid, "Turn complete");
  } else if (kind === "Usage" || kind === "usage") {
    var u = ev.Usage || ev.usage || {};
    if (u.input_tokens) totalIn += u.input_tokens;
    if (u.output_tokens) totalOut += u.output_tokens;
    if (u.model) currentModel = u.model;
  }
  updateStats();
}

/* ── WebSocket ─────────────────────────────────────────────────────────────── */
function setStatus(s) {
  var dot = $("status-dot");
  setText("status-label", s);
  dot.className = s === "connected" ? "connected" : "";
}

function scheduleReconnect(url) {
  if (reconnectTimer) return;
  reconnectTimer = setTimeout(function() {
    reconnectTimer = null;
    reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
    openWs(url);
  }, reconnectDelay);
}

function openWs(url) {
  try { ws = new WebSocket(url); } catch(e) {
    setStatus("disconnected"); scheduleReconnect(url); return;
  }
  setStatus("connecting");
  ws.onopen = function() { setStatus("connected"); reconnectDelay = 2000; };
  ws.onclose = function() {
    setStatus("disconnected");
    if (!intentionalClose) scheduleReconnect(url);
  };
  ws.onerror = function() { setStatus("error"); };
  ws.onmessage = function(ev) {
    var msg;
    try { msg = JSON.parse(ev.data); } catch(e) { return; }
    if (msg.msg_type === "stream") handleStream(msg);
    else handleResponse(msg);
  };
}

function connect() {
  intentionalClose = false;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  if (ws) { intentionalClose = true; ws.close(); }
  var url = $("ws-url-input").value.trim() || "ws://localhost:8080/ws";
  openWs(url);
}

/* ── Init ──────────────────────────────────────────────────────────────────── */
$("connect-btn").addEventListener("click", connect);
$("clr-tl").addEventListener("click", function() { $("timeline").innerHTML = ""; });
$("clr-tc").addEventListener("click", function() { $("tool-tbody").innerHTML = ""; });
updateStats();
connect();
</script>
</body>
</html>
