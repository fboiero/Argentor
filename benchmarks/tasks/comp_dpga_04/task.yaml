  dpga_indicators=9 — DpgaAssessment evaluates all 9 DPGA indicators.
  Argentor: AGPL-3.0 license, SDG-aligned, documented, open data extraction,
  security audit, open standards (MCP/JSON-RPC), no lock-in, public repo,
  community-funded.
