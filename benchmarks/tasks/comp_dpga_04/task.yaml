id: comp_dpga_04
name: Compliance — DPGA indicator evaluation
description: |
  Q-03 compliance benchmark: DPGA dimension.
  Verify that Argentor's DpgaAssessment evaluates all 9 Digital Public Goods
  Alliance indicators. DPGA requires open source, open data, open standards,
  open content, adherence to best practices, and no vendor lock-in.
  Competitors score 0 — no DPGA assessment module.
kind: compliance
prompt: |
  Assess DPGA (Digital Public Goods Alliance) compliance. Evaluate all 9
  DPGA indicators: (1) relevance to SDGs, (2) open license,
  (3) documentation, (4) mechanism for extraction of data,
  (5) adherence to privacy and security best practices,
  (6) adherence to standards and best practices, (7) no vendor lock-in,
  (8) country ownership, (9) financial sustainability. Report total indicators
  evaluated and passed.
input: ""
