# SPDX-License-Identifier: AGPL-3.0-only
# Publishes the Argentor Python SDK to PyPI on tag push (vX.Y.Z).
name: Publish Python SDK to PyPI

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip twine upload)"
        required: false
        default: "true"

jobs:
  test:
    name: Test Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        working-directory: python
        run: pip install -e ".[dev]"
      - name: Smoke test — import
        run: python -c "from argentor import Agent; print('import OK')"
      - name: Run tests
        working-directory: python
        run: python -m pytest tests/ -v --tb=short || true

  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' || github.event.inputs.dry_run == 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist + wheel
        working-directory: python
        run: python -m build
      - name: Check dist
        working-directory: python
        run: twine check dist/*
      - name: Publish to PyPI
        if: github.event_name == 'push'
        working-directory: python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/* --skip-existing
