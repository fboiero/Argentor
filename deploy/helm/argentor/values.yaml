replicaCount: 1

image:
  repository: ghcr.io/fboiero/argentor
  pullPolicy: IfNotPresent
  tag: ""  # defaults to Chart.appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: argentor.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: "1"
    memory: 256Mi
  requests:
    cpu: 250m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

config:
  logLevel: info
  bind: "0.0.0.0:3000"

# API keys and other secrets — rendered into a Kubernetes Secret and injected
# into the pod via envFrom. Leave a value empty to omit it from the Secret.
secrets:
  anthropicApiKey: ""
  openaiApiKey: ""
  groqApiKey: ""

# Extra env vars rendered as a literal list (each item must follow the
# core/v1 EnvVar schema, e.g. {name: FOO, value: bar} or
# {name: FOO, valueFrom: ...}).
env: []

# Extra envFrom sources (in addition to the auto-generated Secret).
envFrom: []

nodeSelector: {}
tolerations: []
affinity: {}
